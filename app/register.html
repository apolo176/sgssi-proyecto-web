<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/register.js"></script>

    <link rel="stylesheet" href="styles.css">
    <title>SGSSI</title>
</head>

<body>
    <h1>Registro de usuario</h1>
    <p>Rellena el siguiente formulario para registrarte en nuestra web:</p>
    
    <form onsubmit="submitForm(this); return false;">
    
    <label for="nombreapellido">Nombre y apellidos:</label><br>
    <input name="nombreapellido" type="text" placeholder="Nombre y apellidos"><br>

    <label for="DNI">DNI:</label><br>
    <input name="DNI" type="text" placeholder="DNI: 12345678-X"><br>

    <label for="password">Contraseña:</label><br>
    <input name="password" type="password" placeholder="Contraseña"><br>

    <label for="telefono">Teléfono:</label><br>
    <input name="telefono" type="tel" placeholder="Teléfono: 685123456"><br>

    <label for="fechanac">Fecha de Nacimiento:</label><br>
    <input name="fechanac" type="text" placeholder="Fecha de Nacimiento"><br>

    <label for="email">Email:</label><br>
    <input name="email" type="email" placeholder="Email: tuemail@dominio.com"><br>

    <button type="submit">Registrarse</button>
    
    </form>
    <p>Si ya tienes cuenta: <a href="login.html">Inicia sesión</a></p>

</body>

<footer>Desarrollado por: Alex Isasi, Iker Ciordia, Liviu Deleanu, Jon Requies y Eder Torres</footer>

</html>
